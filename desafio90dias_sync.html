<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Desafio 90 Dias</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;padding:16px}
.container{max-width:700px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:#888;margin-bottom:12px}
.sync-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 14px;background:#fff;border:1px solid #e8e8e6;border-radius:10px;font-size:12px;color:#888}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#1D9E75}
.sync-dot.saving{background:#EF9F27}
.sync-dot.err{background:#E24B4A}
.sync-msg{flex:1}
.inicio-bar{background:#fff;border:1px solid #e8e8e6;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.inicio-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inicio-label{font-size:12px;color:#888;white-space:nowrap}
input[type=date]{padding:7px 10px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;font-family:inherit;outline:none}
input[type=date]:focus{border-color:#aaa}
.inicio-info{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.inicio-chip{background:#f5f5f3;border-radius:8px;padding:8px 12px;font-size:12px;color:#888}
.inicio-chip span{font-size:15px;font-weight:600;color:#1a1a1a;display:block;margin-top:2px}
.sl{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.card{background:#fff;border:1px solid #e8e8e6;border-radius:12px;padding:16px;margin-bottom:14px}
.mc{background:#f5f5f3;border-radius:8px;padding:12px 14px}
.ml{font-size:11px;color:#888;margin-bottom:4px}
.mv{font-size:22px;font-weight:600;color:#1a1a1a}
.ms{font-size:11px;color:#888;margin-top:2px}
.tab-bar{display:flex;border-bottom:1px solid #e8e8e6;margin-bottom:20px;overflow-x:auto}
.tb{padding:10px 16px;font-size:13px;cursor:pointer;background:transparent;border:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;font-weight:500;white-space:nowrap}
.tb.ap{color:#1a1a1a;border-bottom-color:#7F77DD}
.tb.at{color:#1a1a1a;border-bottom-color:#1D9E75}
.tb.al{color:#1a1a1a;border-bottom-color:#EF9F27}
.tp{display:none}.tp.active{display:block}
.stbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.st{padding:6px 14px;font-size:12px;cursor:pointer;background:transparent;border:1px solid #e8e8e6;border-radius:99px;color:#888;font-family:inherit;font-weight:500}
.st.active{background:#f5f5f3;color:#1a1a1a;border-color:#ccc;font-weight:600}
.sp{display:none}.sp.active{display:block}
.grid90{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dc{aspect-ratio:1;border-radius:4px;border:1px solid #e8e8e6;background:#f5f5f3;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:#aaa;transition:background .12s;user-select:none}
.dc.dp{background:#7F77DD;border-color:#534AB7;color:#fff;font-weight:600}
.dc.dt{background:#1D9E75;border-color:#0F6E56;color:#fff;font-weight:600}
.dc.dl{background:#EF9F27;border-color:#BA7517;color:#fff;font-weight:600}
.dc:hover{border-color:#aaa}
.pw{background:#f0f0ee;border-radius:99px;height:6px;margin-top:10px;overflow:hidden}
.fp{height:100%;border-radius:99px;background:#7F77DD;transition:width .3s}
.ft{height:100%;border-radius:99px;background:#1D9E75;transition:width .3s}
.fl{height:100%;border-radius:99px;background:#EF9F27;transition:width .3s}
.wkr{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:4px}
.wk{font-size:8px;color:#bbb;text-align:center}
.li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0ee}
.li:last-child{border-bottom:none}
.dotp{width:8px;height:8px;border-radius:50%;background:#7F77DD;flex-shrink:0;margin-top:5px}
.dott{width:8px;height:8px;border-radius:50%;background:#1D9E75;flex-shrink:0;margin-top:5px}
.dotl{width:8px;height:8px;border-radius:50%;background:#EF9F27;flex-shrink:0;margin-top:5px}
.dotc{width:16px;height:16px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;margin-top:2px;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center}
.dotc.checked{background:#1D9E75;border-color:#0F6E56}
.dotc.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.lit{font-size:13px;color:#1a1a1a;flex:1;line-height:1.5}
.lit.done{text-decoration:line-through;color:#aaa}
.db{font-size:11px;color:#ccc;cursor:pointer;padding:2px 8px;border-radius:4px;border:1px solid transparent;flex-shrink:0}
.db:hover{border-color:#e8e8e6;color:#888}
textarea{width:100%;padding:10px 12px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;resize:vertical;font-family:inherit;line-height:1.6;outline:none}
textarea:focus{border-color:#aaa}
input[type=text],input[type=number]{width:100%;padding:9px 12px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;font-family:inherit;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:#aaa}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit;font-weight:500}
.btn:hover{background:#f5f5f3}
.empty{font-size:13px;color:#bbb;padding:8px 0}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:#FAEEDA;color:#854F0B;margin-left:6px;font-weight:600}
.peso-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0ee;flex-wrap:wrap}
.peso-row:last-child{border-bottom:none}
.peso-date{font-size:11px;color:#aaa;width:80px;flex-shrink:0}
.peso-val{font-size:14px;font-weight:600;color:#1a1a1a;flex:1}
.tag-neg{font-size:12px;color:#0F6E56;background:#E1F5EE;padding:2px 8px;border-radius:99px;font-weight:600}
.tag-pos{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:2px 8px;border-radius:99px;font-weight:600}
.tag-zero{font-size:12px;color:#888;background:#f5f5f3;padding:2px 8px;border-radius:99px}
.streak{margin-top:6px;font-size:12px;color:#1D9E75;font-weight:500;min-height:18px}
.livro-card{background:#fff;border:1px solid #e8e8e6;border-radius:12px;padding:14px;margin-bottom:10px}
.livro-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.livro-meta{font-size:11px;color:#aaa;margin-bottom:8px}
.livro-resumo{font-size:13px;color:#555;line-height:1.5;white-space:pre-wrap}
.paginas-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;background:#FAEEDA;color:#854F0B;font-weight:600;margin-right:6px}
</style>
</head>
<body>
<div class="container">
  <h1>Desafio 90 Dias</h1>
  <p class="subtitle">Vida pessoal &amp; TikTok Shop &amp; Leitura</p>

  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-msg" id="sync-msg">Conectando...</span>
  </div>

  <div class="inicio-bar">
    <div class="inicio-row">
      <span class="inicio-label">Data de início do desafio:</span>
      <input type="date" id="data-inicio" onchange="salvarInicio()"/>
    </div>
    <div class="inicio-info" id="inicio-info" style="display:none">
      <div class="inicio-chip">Dia do desafio<span id="dia-atual">--</span></div>
      <div class="inicio-chip">Dias restantes<span id="dias-restantes">--</span></div>
      <div class="inicio-chip">Término previsto<span id="data-fim">--</span></div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tb ap" id="mtb-p" onclick="switchMain('p')">Vida pessoal</button>
    <button class="tb" id="mtb-t" onclick="switchMain('t')">TikTok Shop</button>
    <button class="tb" id="mtb-l" onclick="switchMain('l')">Leitura</button>
  </div>
  <div id="mp-p" class="tp active"></div>
  <div id="mp-t" class="tp"></div>
  <div id="mp-l" class="tp"></div>
</div>

<script>
const SUPABASE_URL='https://lxjaccmqjqmyqzkwtqsh.supabase.co';
const SUPABASE_KEY='sb_publishable_hSdGuP0IPysv5YeJNDdkjQ_cNODV9sD';
const USER_ID='vitor_desafio90';

let S={
  inicio:'',
  p:{done:[],objs:[],objBig:'',metas:[],notas:[],semanas:[],pesos:[]},
  t:{done:[],objs:[],objBig:'',metas:[],fat:[],notas:[],semanas:[]},
  l:{done:[],leituras:[]}
};
let saveTimer=null;

function setSyncStatus(status,msg){
  document.getElementById('sync-dot').className='sync-dot '+status;
  document.getElementById('sync-msg').textContent=msg;
}

async function loadFromCloud(){
  try{
    setSyncStatus('saving','Carregando dados...');
    const res=await fetch(`${SUPABASE_URL}/rest/v1/dados?user_id=eq.${USER_ID}&select=dados`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const json=await res.json();
    if(json&&json.length>0&&json[0].dados){
      S=JSON.parse(json[0].dados);
      ensureDefaults();
    }
    setSyncStatus('ok','Sincronizado com a nuvem');
  }catch(e){
    setSyncStatus('err','Sem conexão — usando dados locais');
    try{const ls=localStorage.getItem('d90v5');if(ls)S=JSON.parse(ls);}catch(e2){}
    ensureDefaults();
  }
  if(S.inicio){
    document.getElementById('data-inicio').value=S.inicio;
    atualizarInfo();
  }
  build('p');build('t');buildLeitura();
}

async function saveToCloud(){
  try{
    setSyncStatus('saving','Salvando...');
    localStorage.setItem('d90v5',JSON.stringify(S));
    const check=await fetch(`${SUPABASE_URL}/rest/v1/dados?user_id=eq.${USER_ID}&select=user_id`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const existing=await check.json();
    const method=existing&&existing.length>0?'PATCH':'POST';
    const url=method==='PATCH'?`${SUPABASE_URL}/rest/v1/dados?user_id=eq.${USER_ID}`:`${SUPABASE_URL}/rest/v1/dados`;
    const body=method==='PATCH'?JSON.stringify({dados:JSON.stringify(S)}):JSON.stringify({user_id:USER_ID,dados:JSON.stringify(S)});
    await fetch(url,{method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body});
    const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok','Salvo às '+t+' — sincronizado');
  }catch(e){
    setSyncStatus('err','Erro ao salvar na nuvem');
    localStorage.setItem('d90v5',JSON.stringify(S));
  }
}

function save(){
  localStorage.setItem('d90v5',JSON.stringify(S));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToCloud,1500);
}

function ensureDefaults(){
  if(!S.inicio)S.inicio='';
  ['p','t'].forEach(k=>{
    if(!S[k])S[k]={};
    if(!S[k].metas)S[k].metas=[];
    if(!S[k].notas)S[k].notas=[];
    if(!S[k].semanas)S[k].semanas=[];
    if(!S[k].objs)S[k].objs=[];
    if(!S[k].objBig)S[k].objBig='';
    if(!S[k].done)S[k].done=[];
  });
  if(!S.t.fat)S.t.fat=[];
  if(!S.p.pesos)S.p.pesos=[];
  if(!S.l)S.l={done:[],leituras:[]};
  if(!S.l.done)S.l.done=[];
  if(!S.l.leituras)S.l.leituras=[];
}

function salvarInicio(){
  S.inicio=document.getElementById('data-inicio').value;
  save();atualizarInfo();
}

function atualizarInfo(){
  if(!S.inicio){document.getElementById('inicio-info').style.display='none';return;}
  const inicio=new Date(S.inicio+'T00:00:00');
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const diff=Math.floor((hoje-inicio)/(1000*60*60*24));
  const diaAtual=Math.max(1,Math.min(90,diff+1));
  const restantes=Math.max(0,90-diff);
  const fim=new Date(inicio);fim.setDate(fim.getDate()+89);
  document.getElementById('dia-atual').textContent='Dia '+diaAtual;
  document.getElementById('dias-restantes').textContent=restantes+' dias';
  document.getElementById('data-fim').textContent=fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('inicio-info').style.display='flex';
}

function hoje(){return new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}

function switchMain(k){
  document.querySelectorAll('.tp').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(e=>{e.classList.remove('ap');e.classList.remove('at');e.classList.remove('al');});
  document.getElementById('mp-'+k).classList.add('active');
  const cls=k==='p'?'ap':k==='t'?'at':'al';
  document.getElementById('mtb-'+k).classList.add(cls);
}

function switchSub(k,s){
  document.querySelectorAll('#mp-'+k+' .sp').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('#mp-'+k+' .st').forEach(e=>e.classList.remove('active'));
  document.getElementById(k+'-sp-'+s).classList.add('active');
  document.getElementById(k+'-st-'+s).classList.add('active');
}

function build(k){
  const el=document.getElementById('mp-'+k);
  const isTk=k==='t';
  el.innerHTML=`
    <div class="stbar">
      <button class="st active" id="${k}-st-tracker" onclick="switchSub('${k}','tracker')">Desafio 90 dias</button>
      <button class="st" id="${k}-st-objetivos" onclick="switchSub('${k}','objetivos')">Objetivos</button>
      <button class="st" id="${k}-st-metas" onclick="switchSub('${k}','metas')">Metas</button>
      ${!isTk?`<button class="st" id="${k}-st-peso" onclick="switchSub('${k}','peso')">Peso</button>`:''}
      <button class="st" id="${k}-st-notas" onclick="switchSub('${k}','notas')">Notas do dia</button>
      <button class="st" id="${k}-st-semana" onclick="switchSub('${k}','semana')">Resumo semanal</button>
      ${isTk?`<button class="st" id="${k}-st-fat" onclick="switchSub('${k}','fat')">Faturamento</button>`:''}
    </div>
    <div id="${k}-sp-tracker" class="sp active">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
        <div class="mc"><div class="ml">Dias feitos</div><div class="mv" id="${k}-dn">0</div><div class="ms">de 90</div></div>
        <div class="mc"><div class="ml">Restam</div><div class="mv" id="${k}-rl">90</div><div class="ms">dias</div></div>
        <div class="mc"><div class="ml">Semana</div><div class="mv" id="${k}-wn">1</div><div class="ms">de 13</div></div>
        <div class="mc"><div class="ml">Progresso</div><div class="mv" id="${k}-pc">0%</div><div class="ms">concluído</div></div>
      </div>
      <div class="card">
        <div class="sl">Tracker — toque para marcar o dia</div>
        <div class="wkr" id="${k}-wkl"></div>
        <div class="grid90" id="${k}-grid"></div>
        <div class="pw"><div class="${isTk?'ft':'fp'}" id="${k}-bar" style="width:0%"></div></div>
        <div class="streak" id="${k}-strk"></div>
      </div>
    </div>
    <div id="${k}-sp-objetivos" class="sp">
      <div class="card">
        <div class="sl">Por que você está fazendo esse desafio?</div>
        <textarea id="${k}-obj-big" style="min-height:120px" placeholder="Escreva aqui o propósito desse desafio de 90 dias..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" onclick="saveObjBig('${k}')">Salvar</button></div>
      </div>
      <div class="card">
        <div class="sl">Objetivos específicos</div>
        <div id="${k}-obj-list"></div>
        <div style="margin-top:12px">
          <input type="text" id="${k}-obj-input" placeholder="${isTk?'Ex: Ter 6 contas ativas vendendo todo dia...':'Ex: Acordar às 6h, ler 10 páginas por dia...'}" style="margin-bottom:8px"/>
          <button class="btn" onclick="addObj('${k}')">Adicionar objetivo</button>
        </div>
      </div>
    </div>
    <div id="${k}-sp-metas" class="sp">
      <div class="card">
        <div class="sl">Metas do desafio</div>
        <div id="${k}-meta-list"></div>
        <div style="margin-top:14px;border-top:1px solid #f0f0ee;padding-top:14px">
          <input type="text" id="${k}-meta-input" placeholder="${isTk?'Ex: Fazer R$ 5.000 em 90 dias...':'Ex: Perder 5kg, ler 3 livros...'}" style="margin-bottom:8px"/>
          <button class="btn" onclick="addMeta('${k}')">Adicionar meta</button>
        </div>
      </div>
    </div>
    ${!isTk?`
    <div id="${k}-sp-peso" class="sp">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        <div class="mc"><div class="ml">Peso inicial</div><div class="mv" id="peso-inicial">--</div><div class="ms">kg</div></div>
        <div class="mc"><div class="ml">Peso atual</div><div class="mv" id="peso-atual">--</div><div class="ms">kg</div></div>
        <div class="mc"><div class="ml">Diferença</div><div class="mv" id="peso-diff" style="font-size:18px">--</div><div class="ms" id="peso-diff-label">kg</div></div>
      </div>
      <div class="card">
        <div class="sl">Registrar peso</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div style="font-size:12px;color:#888;margin-bottom:4px">Peso (kg)</div><input type="number" id="peso-input" placeholder="Ex: 78.5" step="0.1" min="0"/></div>
          <div><div style="font-size:12px;color:#888;margin-bottom:4px">Observação (opcional)</div><input type="text" id="peso-obs" placeholder="Ex: depois do treino..."/></div>
        </div>
        <button class="btn" onclick="addPeso()">Registrar</button>
      </div>
      <div class="card">
        <div class="sl">Histórico de peso</div>
        <div id="peso-chart" style="margin-bottom:12px"></div>
        <div id="peso-list"></div>
      </div>
    </div>`:''}
    <div id="${k}-sp-notas" class="sp">
      <div class="card">
        <div class="sl">Observações e tarefas para amanhã</div>
        <textarea id="${k}-nota-input" style="min-height:100px" placeholder="O que precisa ser feito amanhã? Alguma observação importante do dia de hoje?"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addNota('${k}')">Salvar nota</button></div>
      </div>
      <div class="card"><div class="sl">Notas salvas</div><div id="${k}-notas-list"></div></div>
    </div>
    <div id="${k}-sp-semana" class="sp">
      <div class="card">
        <div class="sl">Como foi a semana?</div>
        <input type="text" id="${k}-sem-titulo" placeholder="Ex: Semana 1, Semana 2..." style="margin-bottom:8px"/>
        <textarea id="${k}-sem-input" style="min-height:110px" placeholder="Escreva aqui como foi a semana, o que funcionou, o que pode melhorar..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addSemana('${k}')">Salvar resumo</button></div>
      </div>
      <div class="card"><div class="sl">Resumos salvos</div><div id="${k}-sem-list"></div></div>
    </div>
    ${isTk?`
    <div id="${k}-sp-fat" class="sp">
      <div class="card">
        <div class="sl">Registrar faturamento</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input type="text" id="fat-lbl" placeholder="Ex: Semana 1, Abril..."/>
          <input type="text" id="fat-vl" placeholder="Ex: R$ 350,00"/>
        </div>
        <button class="btn" onclick="addFat()">Adicionar registro</button>
      </div>
      <div class="card">
        <div class="sl">Histórico</div>
        <div id="fat-list"></div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #f0f0ee;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;color:#888">Total acumulado</span>
          <span style="font-size:16px;font-weight:600;color:#1a1a1a" id="fat-total">R$ 0,00</span>
        </div>
      </div>
    </div>`:''}
  `;
  renderGrid(k);renderObjs(k);renderMetas(k);renderNotas(k);renderSemanas(k);
  if(!isTk)renderPeso();
  if(isTk)renderFat();
  const big=document.getElementById(k+'-obj-big');
  if(big&&S[k].objBig)big.value=S[k].objBig;
}

function buildLeitura(){
  const el=document.getElementById('mp-l');
  el.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
      <div class="mc"><div class="ml">Dias lidos</div><div class="mv" id="l-dn">0</div><div class="ms">de 90</div></div>
      <div class="mc"><div class="ml">Páginas lidas</div><div class="mv" id="l-pags">0</div><div class="ms">estimadas</div></div>
      <div class="mc"><div class="ml">Progresso</div><div class="mv" id="l-pc">0%</div><div class="ms">concluído</div></div>
    </div>
    <div class="card">
      <div class="sl">Tracker de leitura — toque para marcar o dia</div>
      <div class="wkr" id="l-wkl"></div>
      <div class="grid90" id="l-grid"></div>
      <div class="pw"><div class="fl" id="l-bar" style="width:0%"></div></div>
      <div class="streak" id="l-strk"></div>
    </div>
    <div class="card">
      <div class="sl">Registrar leitura do dia</div>
      <div style="margin-bottom:8px">
        <div style="font-size:12px;color:#888;margin-bottom:4px">Livro / título</div>
        <input type="text" id="l-livro" placeholder="Ex: Hábitos Atômicos, A Arte da Guerra..."/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div>
          <div style="font-size:12px;color:#888;margin-bottom:4px">Páginas lidas hoje</div>
          <input type="number" id="l-pags-input" placeholder="Ex: 10" min="1"/>
        </div>
        <div>
          <div style="font-size:12px;color:#888;margin-bottom:4px">Página que parou</div>
          <input type="number" id="l-pagina-parou" placeholder="Ex: 85" min="1"/>
        </div>
      </div>
      <div style="font-size:12px;color:#888;margin-bottom:4px">Resumo do que leu hoje</div>
      <textarea id="l-resumo" style="min-height:100px" placeholder="Escreva aqui os pontos principais do que você leu hoje..."></textarea>
      <button class="btn" onclick="addLeitura()">Salvar leitura</button>
    </div>
    <div class="card">
      <div class="sl">Histórico de leituras</div>
      <div id="l-lista"></div>
    </div>
  `;
  renderGridLeitura();
  renderLeituras();
}

function renderGridLeitura(){
  const wl=document.getElementById('l-wkl');if(!wl)return;
  wl.innerHTML='';
  for(let i=1;i<=10;i++){const d=document.createElement('div');d.className='wk';d.textContent='S'+i;wl.appendChild(d);}
  const grid=document.getElementById('l-grid');grid.innerHTML='';
  for(let i=1;i<=90;i++){
    const c=document.createElement('div');
    c.className='dc'+(S.l.done.includes(i)?' dl':'');
    c.textContent=i;c.onclick=()=>toggleDayL(i);grid.appendChild(c);
  }
  const d=S.l.done.length;
  const dn=document.getElementById('l-dn');if(dn)dn.textContent=d;
  const pc=document.getElementById('l-pc');if(pc)pc.textContent=Math.round(d/90*100)+'%';
  const bar=document.getElementById('l-bar');if(bar)bar.style.width=Math.round(d/90*100)+'%';
  const pags=document.getElementById('l-pags');if(pags)pags.textContent=d*10;
  const sorted=[...S.l.done].sort((a,b)=>a-b);let streak=0;
  for(let i=sorted.length-1;i>=0;i--){if(i===sorted.length-1||sorted[i]===sorted[i+1]-1)streak++;else break;}
  const strk=document.getElementById('l-strk');
  if(strk)strk.textContent=streak>1?'🔥 '+streak+' dias lendo — continue assim!':'';
}

function toggleDayL(i){
  if(S.l.done.includes(i))S.l.done=S.l.done.filter(x=>x!==i);else S.l.done.push(i);
  save();renderGridLeitura();
}

function addLeitura(){
  const livro=document.getElementById('l-livro').value.trim();
  const pags=parseInt(document.getElementById('l-pags-input').value)||10;
  const parou=document.getElementById('l-pagina-parou').value.trim();
  const resumo=document.getElementById('l-resumo').value.trim();
  if(!resumo)return;
  S.l.leituras.push({date:hoje(),livro:livro||'Sem título',pags,parou,resumo});
  document.getElementById('l-livro').value='';
  document.getElementById('l-pags-input').value='';
  document.getElementById('l-pagina-parou').value='';
  document.getElementById('l-resumo').value='';
  save();renderLeituras();
}

function renderLeituras(){
  const el=document.getElementById('l-lista');if(!el)return;
  if(!S.l.leituras.length){el.innerHTML='<div class="empty">Nenhuma leitura registrada ainda.</div>';return;}
  el.innerHTML='';
  [...S.l.leituras].reverse().forEach((l,ri)=>{
    const i=S.l.leituras.length-1-ri;
    const d=document.createElement('div');d.className='livro-card';
    d.innerHTML=`
      <div class="livro-title">${l.livro}</div>
      <div class="livro-meta">
        ${l.date}
        <span class="paginas-badge">${l.pags} páginas</span>
        ${l.parou?`<span style="font-size:11px;color:#aaa">parou na pág. ${l.parou}</span>`:''}
      </div>
      <div class="livro-resumo">${l.resumo}</div>
      <div style="margin-top:8px"><span class="db" onclick="delLeitura(${i})">remover</span></div>
    `;
    el.appendChild(d);
  });
}

function delLeitura(i){S.l.leituras.splice(i,1);save();renderLeituras();}

function saveObjBig(k){
  S[k].objBig=document.getElementById(k+'-obj-big').value;save();
  const el=document.getElementById(k+'-obj-big');
  el.style.borderColor='#1D9E75';setTimeout(()=>{el.style.borderColor='';},1200);
}

function renderGrid(k){
  const wl=document.getElementById(k+'-wkl');if(!wl)return;
  wl.innerHTML='';
  for(let i=1;i<=10;i++){const d=document.createElement('div');d.className='wk';d.textContent='S'+i;wl.appendChild(d);}
  const grid=document.getElementById(k+'-grid');grid.innerHTML='';
  for(let i=1;i<=90;i++){
    const c=document.createElement('div');
    c.className='dc'+(S[k].done.includes(i)?(k==='p'?' dp':' dt'):'');
    c.textContent=i;c.onclick=()=>toggleDay(k,i);grid.appendChild(c);
  }
  renderMetrics(k);
}

function toggleDay(k,i){
  const d=S[k].done;
  if(d.includes(i))S[k].done=d.filter(x=>x!==i);else S[k].done.push(i);
  save();renderGrid(k);
}

function renderMetrics(k){
  const d=S[k].done.length;
  const g=id=>document.getElementById(k+'-'+id);if(!g('dn'))return;
  g('dn').textContent=d;g('rl').textContent=90-d;
  g('wn').textContent=Math.min(13,Math.ceil(Math.max(d,1)/7));
  g('pc').textContent=Math.round(d/90*100)+'%';
  g('bar').style.width=Math.round(d/90*100)+'%';
  const sorted=[...S[k].done].sort((a,b)=>a-b);let streak=0;
  for(let i=sorted.length-1;i>=0;i--){if(i===sorted.length-1||sorted[i]===sorted[i+1]-1)streak++;else break;}
  g('strk').textContent=streak>1?'🔥 '+streak+' dias seguidos — continue assim!':'';
}

function renderObjs(k){
  const el=document.getElementById(k+'-obj-list');if(!el)return;
  const dot=k==='p'?'dotp':'dott';
  if(!S[k].objs.length){el.innerHTML='<div class="empty">Nenhum objetivo ainda.</div>';return;}
  el.innerHTML='';
  S[k].objs.forEach((o,i)=>{
    const r=document.createElement('div');r.className='li';
    r.innerHTML=`<div class="${dot}"></div><div class="lit">${o}</div><div class="db" onclick="delObj('${k}',${i})">remover</div>`;
    el.appendChild(r);
  });
}
function addObj(k){const inp=document.getElementById(k+'-obj-input');const v=inp.value.trim();if(!v)return;S[k].objs.push(v);inp.value='';save();renderObjs(k);}
function delObj(k,i){S[k].objs.splice(i,1);save();renderObjs(k);}

function renderMetas(k){
  const el=document.getElementById(k+'-meta-list');if(!el)return;
  if(!S[k].metas.length){el.innerHTML='<div class="empty">Nenhuma meta ainda.</div>';return;}
  el.innerHTML='';
  S[k].metas.forEach((m,i)=>{
    const r=document.createElement('div');r.className='li';
    r.innerHTML=`<div class="dotc ${m.done?'checked':''}" onclick="toggleMeta('${k}',${i})"></div><div class="lit ${m.done?'done':''}">${m.text}${m.done?'<span class="badge">concluída</span>':''}</div><div class="db" onclick="delMeta('${k}',${i})">remover</div>`;
    el.appendChild(r);
  });
}
function toggleMeta(k,i){S[k].metas[i].done=!S[k].metas[i].done;save();renderMetas(k);}
function addMeta(k){const inp=document.getElementById(k+'-meta-input');const v=inp.value.trim();if(!v)return;S[k].metas.push({text:v,done:false});inp.value='';save();renderMetas(k);}
function delMeta(k,i){S[k].metas.splice(i,1);save();renderMetas(k);}

function renderPeso(){
  const pesos=S.p.pesos;
  const piEl=document.getElementById('peso-inicial');if(!piEl)return;
  const paEl=document.getElementById('peso-atual');
  const pdEl=document.getElementById('peso-diff');
  const pdlEl=document.getElementById('peso-diff-label');
  if(!pesos.length){
    piEl.textContent='--';paEl.textContent='--';pdEl.textContent='--';
    document.getElementById('peso-list').innerHTML='<div class="empty">Nenhum registro ainda.</div>';
    document.getElementById('peso-chart').innerHTML='';return;
  }
  const primeiro=pesos[0].val;const ultimo=pesos[pesos.length-1].val;
  const diff=parseFloat((ultimo-primeiro).toFixed(1));
  piEl.textContent=primeiro.toFixed(1);paEl.textContent=ultimo.toFixed(1);
  if(diff===0){pdEl.textContent='0';pdEl.style.color='#888';pdlEl.textContent='kg (estável)';}
  else if(diff<0){pdEl.textContent=diff.toFixed(1);pdEl.style.color='#0F6E56';pdlEl.textContent='kg perdidos';}
  else{pdEl.textContent='+'+diff.toFixed(1);pdEl.style.color='#A32D2D';pdlEl.textContent='kg ganhos';}
  const chartEl=document.getElementById('peso-chart');
  if(pesos.length>1){
    const vals=pesos.map(p=>p.val);
    const mn=Math.min(...vals)-1;const mx=Math.max(...vals)+1;const range=mx-mn||1;
    const bars=pesos.map((p,i)=>{
      const h=Math.round(((p.val-mn)/range)*70)+10;
      const color=i===0?'#ccc':p.val<pesos[i-1].val?'#1D9E75':p.val>pesos[i-1].val?'#E24B4A':'#7F77DD';
      return `<div title="${p.val}kg" style="flex:1;height:${h}px;background:${color};border-radius:3px 3px 0 0;min-width:6px"></div>`;
    }).join('');
    chartEl.innerHTML=`<div style="display:flex;align-items:flex-end;gap:3px;height:80px">${bars}</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:4px"><span>${pesos[0].date}</span><span>${pesos[pesos.length-1].date}</span></div>`;
  }else{chartEl.innerHTML='';}
  const listEl=document.getElementById('peso-list');listEl.innerHTML='';
  [...pesos].reverse().forEach((p,ri)=>{
    const i=pesos.length-1-ri;
    let dh='';
    if(i>0){const d=parseFloat((p.val-pesos[i-1].val).toFixed(1));
      if(d<0)dh=`<span class="tag-neg">${d.toFixed(1)} kg</span>`;
      else if(d>0)dh=`<span class="tag-pos">+${d.toFixed(1)} kg</span>`;
      else dh=`<span class="tag-zero">estável</span>`;
    }else{dh=`<span class="tag-zero">inicial</span>`;}
    const r=document.createElement('div');r.className='peso-row';
    r.innerHTML=`<div class="peso-date">${p.date}</div><div class="peso-val">${p.val.toFixed(1)} kg${p.obs?`<span style="font-size:11px;font-weight:400;color:#aaa;margin-left:6px">${p.obs}</span>`:''}</div>${dh}<div class="db" style="margin-left:8px" onclick="delPeso(${i})">remover</div>`;
    listEl.appendChild(r);
  });
}
function addPeso(){
  const v=parseFloat(document.getElementById('peso-input').value);
  const obs=document.getElementById('peso-obs').value.trim();
  if(!v||v<=0)return;
  S.p.pesos.push({val:v,obs,date:hoje()});
  document.getElementById('peso-input').value='';document.getElementById('peso-obs').value='';
  save();renderPeso();
}
function delPeso(i){S.p.pesos.splice(i,1);save();renderPeso();}

function renderNotas(k){
  const el=document.getElementById(k+'-notas-list');if(!el)return;
  if(!S[k].notas.length){el.innerHTML='<div class="empty">Nenhuma nota ainda.</div>';return;}
  el.innerHTML='';
  [...S[k].notas].reverse().forEach((n,ri)=>{
    const i=S[k].notas.length-1-ri;
    const d=document.createElement('div');d.className='li';d.style.flexDirection='column';d.style.alignItems='flex-start';
    d.innerHTML=`<div style="font-size:11px;color:#aaa">${n.date}</div><div style="font-size:13px;color:#1a1a1a;line-height:1.5;white-space:pre-wrap;margin-top:4px">${n.text}</div><div style="margin-top:6px"><span class="db" onclick="delNota('${k}',${i})">remover</span></div>`;
    el.appendChild(d);
  });
}
function addNota(k){const inp=document.getElementById(k+'-nota-input');const v=inp.value.trim();if(!v)return;S[k].notas.push({date:hoje(),text:v});inp.value='';save();renderNotas(k);}
function delNota(k,i){S[k].notas.splice(i,1);save();renderNotas(k);}

function renderSemanas(k){
  const el=document.getElementById(k+'-sem-list');if(!el)return;
  if(!S[k].semanas.length){el.innerHTML='<div class="empty">Nenhum resumo ainda.</div>';return;}
  el.innerHTML='';
  [...S[k].semanas].reverse().forEach((s,ri)=>{
    const i=S[k].semanas.length-1-ri;
    const d=document.createElement('div');d.style.cssText='padding:10px 0;border-bottom:1px solid #f0f0ee';
    d.innerHTML=`<div style="font-size:12px;font-weight:600;color:#888;margin-bottom:4px">${s.titulo} <span style="font-weight:400;color:#bbb;font-size:11px">${s.date}</span></div><div style="font-size:13px;color:#1a1a1a;line-height:1.5;white-space:pre-wrap">${s.text}</div><div style="margin-top:6px"><span class="db" onclick="delSemana('${k}',${i})">remover</span></div>`;
    el.appendChild(d);
  });
}
function addSemana(k){
  const titulo=document.getElementById(k+'-sem-titulo').value.trim()||'Sem título';
  const v=document.getElementById(k+'-sem-input').value.trim();if(!v)return;
  S[k].semanas.push({titulo,date:hoje(),text:v});
  document.getElementById(k+'-sem-titulo').value='';document.getElementById(k+'-sem-input').value='';
  save();renderSemanas(k);
}
function delSemana(k,i){S[k].semanas.splice(i,1);save();renderSemanas(k);}

function renderFat(){
  const el=document.getElementById('fat-list');if(!el)return;
  if(!S.t.fat.length){el.innerHTML='<div class="empty">Nenhum registro ainda.</div>';document.getElementById('fat-total').textContent='R$ 0,00';return;}
  el.innerHTML='';let total=0;
  S.t.fat.forEach((f,i)=>{
    const num=parseFloat(f.val.replace(/[^\d,]/g,'').replace(',','.'))||0;total+=num;
    const r=document.createElement('div');r.className='li';
    r.innerHTML=`<div style="font-size:13px;color:#888;width:90px;flex-shrink:0">${f.label}</div><div style="font-size:13px;font-weight:600;color:#1a1a1a;flex:1">${f.val}</div><div class="db" onclick="delFat(${i})">remover</div>`;
    el.appendChild(r);
  });
  document.getElementById('fat-total').textContent='R$ '+total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function addFat(){
  const l=document.getElementById('fat-lbl').value.trim();const v=document.getElementById('fat-vl').value.trim();if(!l||!v)return;
  S.t.fat.push({label:l,val:v});document.getElementById('fat-lbl').value='';document.getElementById('fat-vl').value='';save();renderFat();
}
function delFat(i){S.t.fat.splice(i,1);save();renderFat();}

loadFromCloud();
</script>
