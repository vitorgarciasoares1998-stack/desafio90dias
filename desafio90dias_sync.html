<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Desafio 90 Dias</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;padding:16px}
.container{max-width:700px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:#888;margin-bottom:12px}
.sync-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 14px;background:#fff;border:1px solid #e8e8e6;border-radius:10px;font-size:12px;color:#888}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#1D9E75}.sync-dot.saving{background:#EF9F27}.sync-dot.err{background:#E24B4A}
.sync-msg{flex:1}
.inicio-bar{background:#fff;border:1px solid #e8e8e6;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.inicio-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inicio-label{font-size:12px;color:#888;white-space:nowrap}
input[type=date]{padding:7px 10px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;font-family:inherit;outline:none}
input[type=date]:focus{border-color:#aaa}
.inicio-info{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.inicio-chip{background:#f5f5f3;border-radius:8px;padding:8px 12px;font-size:12px;color:#888}
.inicio-chip span{font-size:15px;font-weight:600;color:#1a1a1a;display:block;margin-top:2px}
.sl{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.card{background:#fff;border:1px solid #e8e8e6;border-radius:12px;padding:16px;margin-bottom:14px}
.mc{background:#f5f5f3;border-radius:8px;padding:12px 14px}
.ml{font-size:11px;color:#888;margin-bottom:4px}
.mv{font-size:22px;font-weight:600;color:#1a1a1a}
.ms{font-size:11px;color:#888;margin-top:2px}
.tab-bar{display:flex;border-bottom:1px solid #e8e8e6;margin-bottom:20px;overflow-x:auto}
.tb{padding:10px 14px;font-size:13px;cursor:pointer;background:transparent;border:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;font-weight:500;white-space:nowrap}
.tb.ap{color:#1a1a1a;border-bottom-color:#7F77DD}
.tb.at{color:#1a1a1a;border-bottom-color:#1D9E75}
.tb.al{color:#1a1a1a;border-bottom-color:#EF9F27}
.tb.atr{color:#1a1a1a;border-bottom-color:#E24B4A}
.tp{display:none}.tp.active{display:block}
.stbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.st{padding:6px 14px;font-size:12px;cursor:pointer;background:transparent;border:1px solid #e8e8e6;border-radius:99px;color:#888;font-family:inherit;font-weight:500}
.st.active{background:#f5f5f3;color:#1a1a1a;border-color:#ccc;font-weight:600}
.sp{display:none}.sp.active{display:block}
.grid90{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dc{aspect-ratio:1;border-radius:4px;border:1px solid #e8e8e6;background:#f5f5f3;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:#aaa;transition:background .12s;user-select:none}
.dc.dp{background:#7F77DD;border-color:#534AB7;color:#fff;font-weight:600}
.dc.dt{background:#1D9E75;border-color:#0F6E56;color:#fff;font-weight:600}
.dc.dl{background:#EF9F27;border-color:#BA7517;color:#fff;font-weight:600}
.dc.dtr{background:#E24B4A;border-color:#A32D2D;color:#fff;font-weight:600}
.dc:hover{border-color:#aaa}
.pw{background:#f0f0ee;border-radius:99px;height:6px;margin-top:10px;overflow:hidden}
.fp{height:100%;border-radius:99px;background:#7F77DD;transition:width .3s}
.ft{height:100%;border-radius:99px;background:#1D9E75;transition:width .3s}
.fl{height:100%;border-radius:99px;background:#EF9F27;transition:width .3s}
.ftr{height:100%;border-radius:99px;background:#E24B4A;transition:width .3s}
.wkr{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:4px}
.wk{font-size:8px;color:#bbb;text-align:center}
.li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0ee}
.li:last-child{border-bottom:none}
.dotc{width:18px;height:18px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;margin-top:1px;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center}
.dotc.checked{background:#1D9E75;border-color:#0F6E56}
.dotc.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.lit{font-size:13px;color:#1a1a1a;flex:1;line-height:1.5}
.lit.done{text-decoration:line-through;color:#aaa}
.db{font-size:11px;color:#ccc;cursor:pointer;padding:2px 8px;border-radius:4px;border:1px solid transparent;flex-shrink:0}
.db:hover{border-color:#e8e8e6;color:#888}
textarea{width:100%;padding:10px 12px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;resize:vertical;font-family:inherit;line-height:1.6;outline:none}
textarea:focus{border-color:#aaa}
input[type=text],input[type=number]{width:100%;padding:9px 12px;border:1px solid #e8e8e6;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;font-family:inherit;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:#aaa}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit;font-weight:500}
.btn:hover{background:#f5f5f3}
.empty{font-size:13px;color:#bbb;padding:8px 0}
.badge-ok{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:#E1F5EE;color:#0F6E56;margin-left:6px;font-weight:600}
.peso-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0ee;flex-wrap:wrap}
.peso-row:last-child{border-bottom:none}
.peso-date{font-size:11px;color:#aaa;width:80px;flex-shrink:0}
.peso-val{font-size:14px;font-weight:600;color:#1a1a1a;flex:1}
.tag-neg{font-size:12px;color:#0F6E56;background:#E1F5EE;padding:2px 8px;border-radius:99px;font-weight:600}
.tag-pos{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:2px 8px;border-radius:99px;font-weight:600}
.tag-zero{font-size:12px;color:#888;background:#f5f5f3;padding:2px 8px;border-radius:99px}
.streak{margin-top:6px;font-size:12px;font-weight:500;min-height:18px}
.progresso-metas{margin-bottom:12px}
.progresso-barra-wrap{flex:1;background:#f0f0ee;border-radius:99px;height:6px;overflow:hidden}
.progresso-barra{height:100%;border-radius:99px;background:#1D9E75;transition:width .3s}
.dia-card{border:1px solid #e8e8e6;border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.dia-card-date{font-size:11px;color:#aaa;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.dia-card-texto{font-size:13px;color:#1a1a1a;line-height:1.6;white-space:pre-wrap}
.tarefa-feita{color:#aaa;text-decoration:line-through}
.emoji-humor{font-size:18px;margin-right:6px}
.humor-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.humor-btn{padding:8px 12px;border-radius:8px;border:1px solid #e8e8e6;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}
.humor-btn.sel{border-color:#7F77DD;background:#EEEDFE;font-weight:600}
</style>
</head>
<body>
<div class="container">
  <h1>Desafio 90 Dias</h1>
  <p class="subtitle">Vida pessoal &amp; TikTok Shop &amp; Leitura &amp; Treino</p>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-msg" id="sync-msg">Conectando...</span>
  </div>
  <div class="inicio-bar">
    <div class="inicio-row">
      <span class="inicio-label">Data de início do desafio:</span>
      <input type="date" id="data-inicio" onchange="salvarInicio()"/>
    </div>
    <div class="inicio-info" id="inicio-info" style="display:none">
      <div class="inicio-chip">Dia do desafio<span id="dia-atual">--</span></div>
      <div class="inicio-chip">Dias restantes<span id="dias-restantes">--</span></div>
      <div class="inicio-chip">Término previsto<span id="data-fim">--</span></div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tb ap" id="mtb-p" onclick="switchMain('p')">Vida pessoal</button>
    <button class="tb" id="mtb-t" onclick="switchMain('t')">TikTok Shop</button>
    <button class="tb" id="mtb-l" onclick="switchMain('l')">Leitura</button>
    <button class="tb" id="mtb-tr" onclick="switchMain('tr')">Treino</button>
  </div>
  <div id="mp-p" class="tp active"></div>
  <div id="mp-t" class="tp"></div>
  <div id="mp-l" class="tp"></div>
  <div id="mp-tr" class="tp"></div>
</div>

<script>
const SUPABASE_URL='https://lxjaccmqjqmyqzkwtqsh.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4amFjY21xanFteXF6a3d0cXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDk5NTIsImV4cCI6MjA5MTUyNTk1Mn0.j7jgLgweiv3t2N_nf4M90gEJGIzcBAaRx4x6mdFcopQ';
const USER_ID='vitor_desafio90';

let S={
  inicio:'',
  p:{done:[],porque:'',metas:[],tarefas:[],diario:[],semanas:[],pesos:[]},
  t:{done:[],porque:'',metas:[],tarefas:[],diario:[],fat:[],semanas:[]},
  l:{done:[],leituras:[]},
  tr:{done:[]}
};
let saveTimer=null;

function setSyncStatus(s,m){document.getElementById('sync-dot').className='sync-dot '+s;document.getElementById('sync-msg').textContent=m;}

async function loadFromCloud(){
  setSyncStatus('saving','Carregando dados...');
  // Tenta carregar da nuvem
  let cloudOk=false;
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/dados?user_id=eq.${USER_ID}&select=dados`,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    if(res.ok){
      const json=await res.json();
      if(json&&json.length>0&&json[0].dados){
        const parsed=JSON.parse(json[0].dados);
        S=parsed;
        ensureDefaults();
        // Atualiza cache local com dados da nuvem
        localStorage.setItem('d90v6',JSON.stringify(S));
        cloudOk=true;
      }
    }
  }catch(e){cloudOk=false;}

  if(!cloudOk){
    // Tenta cache local novo, depois tenta migrar do antigo
    try{
      const ls6=localStorage.getItem('d90v6');
      if(ls6){S=JSON.parse(ls6);ensureDefaults();}
      else{
        const ls5=localStorage.getItem('d90v5');
        if(ls5){S=JSON.parse(ls5);ensureDefaults();save();}
      }
    }catch(e2){}
    setSyncStatus('err','Sem conexão — dados locais');
  } else {
    setSyncStatus('ok','Sincronizado — '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }

  if(S.inicio){document.getElementById('data-inicio').value=S.inicio;atualizarInfo();}
  build('p');build('t');buildLeitura();buildTreino();
}

async function saveToCloud(){
  try{
    setSyncStatus('saving','Salvando...');
    const dadosStr=JSON.stringify(S);
    localStorage.setItem('d90v6',dadosStr);
    const resp=await fetch(`${SUPABASE_URL}/rest/v1/dados`,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({user_id:USER_ID,dados:dadosStr})
    });
    if(!resp.ok){
      const errMsg=await resp.text();
      console.error('Supabase erro:',resp.status,errMsg);
      throw new Error('save failed '+resp.status);
    }
    const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok','Salvo às '+t+' — sincronizado ✓');
  }catch(e){
    console.error('saveToCloud:',e);
    setSyncStatus('err','Erro ao salvar — dados guardados localmente');
    localStorage.setItem('d90v6',JSON.stringify(S));
  }
}

function save(){localStorage.setItem('d90v6',JSON.stringify(S));clearTimeout(saveTimer);saveTimer=setTimeout(saveToCloud,1500);}

function ensureDefaults(){
  if(!S.inicio)S.inicio='';
  ['p','t'].forEach(k=>{
    if(!S[k])S[k]={};
    if(!S[k].metas)S[k].metas=[];
    if(!S[k].tarefas)S[k].tarefas=[];
    if(!S[k].diario)S[k].diario=S[k].notas||[];
    if(!S[k].semanas)S[k].semanas=[];
    if(!S[k].porque)S[k].porque=S[k].objBig||'';
    if(!S[k].done)S[k].done=[];
  });
  if(!S.t.fat)S.t.fat=[];
  if(!S.p.pesos)S.p.pesos=[];
  if(!S.l)S.l={done:[],leituras:[]};
  if(!S.l.done)S.l.done=[];
  if(!S.l.leituras)S.l.leituras=[];
  if(!S.tr)S.tr={done:[]};
  if(!S.tr.done)S.tr.done=[];
}

function salvarInicio(){S.inicio=document.getElementById('data-inicio').value;save();atualizarInfo();}

function atualizarInfo(){
  if(!S.inicio){document.getElementById('inicio-info').style.display='none';return;}
  const inicio=new Date(S.inicio+'T00:00:00');
  const hj=new Date();hj.setHours(0,0,0,0);
  const diff=Math.floor((hj-inicio)/(1000*60*60*24));
  document.getElementById('dia-atual').textContent='Dia '+Math.max(1,Math.min(90,diff+1));
  document.getElementById('dias-restantes').textContent=Math.max(0,90-diff)+' dias';
  const fim=new Date(inicio);fim.setDate(fim.getDate()+89);
  document.getElementById('data-fim').textContent=fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('inicio-info').style.display='flex';
}

function hoje(){return new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function ontem(){const d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}

function switchMain(k){
  document.querySelectorAll('.tp').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(e=>{e.classList.remove('ap');e.classList.remove('at');e.classList.remove('al');e.classList.remove('atr');});
  document.getElementById('mp-'+k).classList.add('active');
  document.getElementById('mtb-'+k).classList.add(k==='p'?'ap':k==='t'?'at':k==='l'?'al':'atr');
}

function switchSub(k,s){
  document.querySelectorAll('#mp-'+k+' .sp').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('#mp-'+k+' .st').forEach(e=>e.classList.remove('active'));
  document.getElementById(k+'-sp-'+s).classList.add('active');
  document.getElementById(k+'-st-'+s).classList.add('active');
}

function build(k){
  const el=document.getElementById('mp-'+k);
  const isTk=k==='t';
  const corBarra=isTk?'ft':'fp';
  el.innerHTML=`
    <div class="stbar">
      <button class="st active" id="${k}-st-tracker" onclick="switchSub('${k}','tracker')">Tracker</button>
      <button class="st" id="${k}-st-metas" onclick="switchSub('${k}','metas')">Metas</button>
      ${!isTk?`<button class="st" id="${k}-st-peso" onclick="switchSub('${k}','peso')">Peso</button>`:''}
      <button class="st" id="${k}-st-tarefas" onclick="switchSub('${k}','tarefas')">Tarefas do dia</button>
      <button class="st" id="${k}-st-diario" onclick="switchSub('${k}','diario')">Como foi meu dia</button>
      <button class="st" id="${k}-st-semana" onclick="switchSub('${k}','semana')">Resumo semanal</button>
      ${isTk?`<button class="st" id="${k}-st-fat" onclick="switchSub('${k}','fat')">Faturamento</button>`:''}
    </div>

    <div id="${k}-sp-tracker" class="sp active">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
        <div class="mc"><div class="ml">Dias feitos</div><div class="mv" id="${k}-dn">0</div><div class="ms">de 90</div></div>
        <div class="mc"><div class="ml">Restam</div><div class="mv" id="${k}-rl">90</div><div class="ms">dias</div></div>
        <div class="mc"><div class="ml">Semana</div><div class="mv" id="${k}-wn">1</div><div class="ms">de 13</div></div>
        <div class="mc"><div class="ml">Progresso</div><div class="mv" id="${k}-pc">0%</div><div class="ms">concluído</div></div>
      </div>
      <div class="card">
        <div class="sl">Tracker — toque para marcar o dia</div>
        <div class="wkr" id="${k}-wkl"></div>
        <div class="grid90" id="${k}-grid"></div>
        <div class="pw"><div class="${corBarra}" id="${k}-bar" style="width:0%"></div></div>
        <div class="streak" id="${k}-strk" style="color:${isTk?'#1D9E75':'#7F77DD'}"></div>
      </div>
    </div>

    <div id="${k}-sp-metas" class="sp">
      <div class="card">
        <div class="sl">Por que estou fazendo esse desafio?</div>
        <div id="${k}-porque-exibe" style="margin-bottom:12px"></div>
        <textarea id="${k}-porque-input" style="min-height:80px" placeholder="Escreva aqui o seu motivo. Isso vai te manter focado nos dias difíceis..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" onclick="salvarPorque('${k}')">Salvar</button></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="sl" style="margin-bottom:0">Minhas metas</div>
          <div id="${k}-prog-metas" style="font-size:12px;color:#888"></div>
        </div>
        <div style="background:#f0f0ee;border-radius:99px;height:6px;margin-bottom:14px;overflow:hidden"><div class="progresso-barra" id="${k}-barra-metas" style="width:0%"></div></div>
        <div id="${k}-meta-list"></div>
        <div style="margin-top:14px;border-top:1px solid #f0f0ee;padding-top:14px">
          <input type="text" id="${k}-meta-input" placeholder="${isTk?'Ex: Fazer R$ 5.000, ter 1000 seguidores por conta...':'Ex: Perder 8kg, treinar 6x na semana, zero açúcar...'}" style="margin-bottom:8px"/>
          <button class="btn" onclick="addMeta('${k}')">Adicionar meta</button>
        </div>
      </div>
    </div>

    ${!isTk?`
    <div id="${k}-sp-peso" class="sp">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        <div class="mc"><div class="ml">Peso inicial</div><div class="mv" id="peso-inicial">--</div><div class="ms">kg</div></div>
        <div class="mc"><div class="ml">Peso atual</div><div class="mv" id="peso-atual">--</div><div class="ms">kg</div></div>
        <div class="mc"><div class="ml">Diferença</div><div class="mv" id="peso-diff" style="font-size:18px">--</div><div class="ms" id="peso-diff-label">kg</div></div>
      </div>
      <div class="card">
        <div class="sl">Registrar peso</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div style="font-size:12px;color:#888;margin-bottom:4px">Peso (kg)</div><input type="number" id="peso-input" placeholder="Ex: 78.5" step="0.1" min="0"/></div>
          <div><div style="font-size:12px;color:#888;margin-bottom:4px">Observação (opcional)</div><input type="text" id="peso-obs" placeholder="Ex: depois do treino..."/></div>
        </div>
        <button class="btn" onclick="addPeso()">Registrar</button>
      </div>
      <div class="card">
        <div class="sl">Histórico de peso</div>
        <div id="peso-chart" style="margin-bottom:12px"></div>
        <div id="peso-list"></div>
      </div>
    </div>`:''}

    <div id="${k}-sp-tarefas" class="sp">
      <div class="card">
        <div class="sl">Tarefas de hoje</div>
        <div id="${k}-tarefa-list"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <input type="text" id="${k}-tarefa-input" placeholder="${isTk?'Ex: Postar nas 6 contas, responder comentários...':'Ex: Treinar, ler 10 páginas, beber 2L de água...'}"/>
          <button class="btn" style="margin-top:0;white-space:nowrap" onclick="addTarefa('${k}')">+ Adicionar</button>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn" style="margin-top:0;font-size:12px;color:#aaa" onclick="limparTarefasConcluidas('${k}')">Limpar concluídas</button>
        </div>
      </div>
    </div>

    <div id="${k}-sp-diario" class="sp">
      <div class="card">
        <div class="sl">Como foi meu dia?</div>
        <div style="margin-bottom:10px">
          <div style="font-size:12px;color:#888;margin-bottom:6px">Escolha a data do dia que está descrevendo</div>

function renderMetrics(k){

  g('dn').textContent=d;g('rl').textContent=90-d;
  g('wn').textContent=Math.min(13,Math.ceil(Math.max(d,1)/7));
  g('pc').textContent=Math.round(d/90*100)+'%';
  g('bar').style.width=Math.round(d/90*100)+'%';
  const sorted=[...S[k].done].sort((a,b)=>a-b);let streak=0;
  for(let i=sorted.length-1;i>=0;i--){if(i===sorted.length-1||sorted[i]===sorted[i+1]-1)streak++;else break;}

function renderPeso(){
  const pesos=S.p.pesos;
  const piEl=document.getElementById('peso-inicial');if(!piEl)return;
  const paEl=document.getElementById('peso-atual');
  const pdEl=document.getElementById('peso-diff');
  const pdlEl=document.getElementById('peso-diff-label');
  if(!pesos.length){
    piEl.textContent='--';paEl.textContent='--';pdEl.textContent='--';
    document.getElementById('peso-list').innerHTML='<div class="empty">Nenhum registro ainda.</div>';
    document.getElementById('peso-chart').innerHTML='';return;
  }
  const primeiro=pesos[0].val;const ultimo=pesos[pesos.length-1].val;
  const diff=parseFloat((ultimo-primeiro).toFixed(1));
  piEl.textContent=primeiro.toFixed(1);paEl.textContent=ultimo.toFixed(1);
  if(diff===0){pdEl.textContent='0';pdEl.style.color='#888';pdlEl.textContent='kg (estável)';}
  else if(diff<0){pdEl.textContent=diff.toFixed(1);pdEl.style.color='#0F6E56';pdlEl.textContent='kg perdidos';}
  else{pdEl.textContent='+'+diff.toFixed(1);pdEl.style.color='#A32D2D';pdlEl.textContent='kg ganhos';}
  const chartEl=document.getElementById('peso-chart');
  if(pesos.length>1){
    const vals=pesos.map(p=>p.val);
    const mn=Math.min(...vals)-1;const mx=Math.max(...vals)+1;const range=mx-mn||1;
    const bars=pesos.map((p,i)=>{
      const h=Math.round(((p.val-mn)/range)*70)+10;
      const color=i===0?'#ccc':p.val<pesos[i-1].val?'#1D9E75':p.val>pesos[i-1].val?'#E24B4A':'#7F77DD';
      return `<div title="${p.val}kg" style="flex:1;height:${h}px;background:${color};border-radius:3px 3px 0 0;min-width:6px"></div>`;
    }).join('');
    chartEl.innerHTML=`<div style="display:flex;align-items:flex-end;gap:3px;height:80px">${bars}</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:4px"><span>${pesos[0].date}</span><span>${pesos[pesos.length-1].date}</span></div>`;
  }else{chartEl.innerHTML='';}
  const listEl=document.getElementById('peso-list');listEl.innerHTML='';
  [...pesos].reverse().forEach((p,ri)=>{
    const i=pesos.length-1-ri;
    let dh='';
    if(i>0){const d=parseFloat((p.val-pesos[i-1].val).toFixed(1));
      if(d<0)dh=`<span class="tag-neg">${d.toFixed(1)} kg</span>`;
      else if(d>0)dh=`<span class="tag-pos">+${d.toFixed(1)} kg</span>`;
      else dh=`<span class="tag-zero">estável</span>`;
    }else{dh=`<span class="tag-zero">inicial</span>`;}
    const r=document.createElement('div');r.className='peso-row';
    r.innerHTML=`<div class="peso-date">${p.date}</div><div class="peso-val">${p.val.toFixed(1)} kg${p.obs?`<span style="font-size:11px;font-weight:400;color:#aaa;margin-left:6px">${p.obs}</span>`:''}</div>${dh}<div class="db" style="margin-left:8px" onclick="delPeso(${i})">remover</div>`;
    listEl.appendChild(r);
  });
}
function addPeso(){
  const v=parseFloat(document.getElementById('peso-input').value);
  const obs=document.getElementById('peso-obs').value.trim();
  if(!v||v<=0)return;
  S.p.pesos.push({val:v,obs,date:hoje()});
  document.getElementById('peso-input').value='';document.getElementById('peso-obs').value='';
  save();renderPeso();
}

      <div class="mc"><div class="ml">Semana</div><div class="mv" id="tr-sem">1</div><div class="ms">de 13</div></div>
      <div class="mc"><div class="ml">Progresso</div><div class="mv" id="tr-pc">0%</div><div class="ms">concluído</div></div>
      <div class="mc"><div class="ml">Descanso</div><div class="mv" id="tr-desc">0</div><div class="ms">dias</div></div>
    </div>
    <div class="card">
      <div class="sl">Tracker — toque para marcar o dia que treinou</div>
      <div class="wkr" id="tr-wkl"></div>
      <div class="grid90" id="tr-grid"></div>
      <div class="pw"><div class="ftr" id="tr-bar" style="width:0%"></div></div>
      <div class="streak" id="tr-strk" style="color:#E24B4A"></div>
    </div>
    <div class="card">
      <div class="sl">Frequência por semana</div>
      <div id="tr-semanas-grid"></div>
    </div>
  `;
  renderGridTreino();renderSemanasTreino();
}

function renderGridTreino(){
  const wl=document.getElementById('tr-wkl');if(!wl)return;
  wl.innerHTML='';
  for(let i=1;i<=10;i++){const d=document.createElement('div');d.className='wk';d.textContent='S'+i;wl.appendChild(d);}
  const grid=document.getElementById('tr-grid');if(!grid)return;
  grid.innerHTML='';
  for(let i=1;i<=90;i++){
    const c=document.createElement('div');
    c.className='dc'+(S.tr.done.includes(i)?' dtr':'');
    c.textContent=i;c.onclick=()=>toggleTreino(i);grid.appendChild(c);
  }
  const d=S.tr.done.length;
  const dn=document.getElementById('tr-dn');if(dn)dn.textContent=d;
  const sem=document.getElementById('tr-sem');if(sem)sem.textContent=Math.min(13,Math.ceil(Math.max(d,1)/7));
  const pc=document.getElementById('tr-pc');if(pc)pc.textContent=Math.round(d/90*100)+'%';
  const desc=document.getElementById('tr-desc');if(desc)desc.textContent=90-d;
  const bar=document.getElementById('tr-bar');if(bar)bar.style.width=Math.round(d/90*100)+'%';
  const sorted=[...S.tr.done].sort((a,b)=>a-b);let streak=0;
  for(let i=sorted.length-1;i>=0;i--){if(i===sorted.length-1||sorted[i]===sorted[i+1]-1)streak++;else break;}
  const strk=document.getElementById('tr-strk');
  if(strk)strk.textContent=streak>1?'🔥 '+streak+' dias seguidos — bora!':'';
}
function renderSemanasTreino(){
  const el=document.getElementById('tr-semanas-grid');if(!el)return;
  el.innerHTML='';
  for(let s=0;s<13;s++){
    const inicio=s*7+1;const fim=Math.min(inicio+6,90);
    const diasSemana=[];for(let d=inicio;d<=fim;d++)diasSemana.push(d);
    const treinos=diasSemana.filter(d=>S.tr.done.includes(d)).length;
    const cor=treinos>=6?'#1D9E75':treinos>=4?'#EF9F27':'#E24B4A';
    const bg=treinos>=6?'#E1F5EE':treinos>=4?'#FAEEDA':'#FCEBEB';
    const semEl=document.createElement('div');
    semEl.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ee';
    semEl.innerHTML=`<div style="font-size:12px;color:#888;width:60px;flex-shrink:0">Sem ${s+1}</div><div style="display:flex;gap:3px;flex:1">${diasSemana.map(d=>`<div style="flex:1;height:20px;border-radius:3px;background:${S.tr.done.includes(d)?'#E24B4A':'#f0f0ee'};border:1px solid ${S.tr.done.includes(d)?'#A32D2D':'#e8e8e6'}" title="Dia ${d}"></div>`).join('')}${diasSemana.length<7?'<div style="flex:1"></div>'.repeat(7-diasSemana.length):''}</div><div style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:${bg};color:${cor};flex-shrink:0">${treinos}x</div>`;
    el.appendChild(semEl);
  }
}
function toggleTreino(i){if(S.tr.done.includes(i))S.tr.done=S.tr.done.filter(x=>x!==i);else S.tr.done.push(i);save();renderGridTreino();renderSemanasTreino();}

loadFromCloud();
</script>
</body>
</html>
